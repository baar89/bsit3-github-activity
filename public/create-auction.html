<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1'>
<title>Create Auction</title><link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css' rel='stylesheet'><link rel='stylesheet' href='/css/styles.css'></head>
<body><div class='container col-md-8'><h2>Create Auction (Admin)</h2><div id='flash'></div>
<form id='form' class='card card-body'>
<input class='form-control mb-2' name='title' placeholder='Title' required>
<input class='form-control mb-2' name='robloxItemName' placeholder='Roblox Item Name' required>
<textarea class='form-control mb-2' name='description' placeholder='Description' required></textarea>
<input class='form-control mb-2' name='image' placeholder='Image URL'>
<input class='form-control mb-2' type='number' name='startPrice' placeholder='Start Price' required>
<input class='form-control mb-2' type='number' name='bidIncrement' placeholder='Bid Increment' required>
<input class='form-control mb-2' type='datetime-local' name='endTime' required>
<button class='btn btn-success'>Create</button></form></div>
<script src='/js/app.js'></script><script>
form.addEventListener('submit', async (e)=>{e.preventDefault();const payload=Object.fromEntries(new FormData(e.target).entries());
try{await fetchCsrf();await api('/admin/auctions',{method:'POST',body:JSON.stringify(payload)});setFlash('Auction created','success');e.target.reset();}catch(err){setFlash(err.message,'danger')}})
</script></body></html>
