<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1'>
<title>Login</title><link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css' rel='stylesheet'><link rel='stylesheet' href='/css/styles.css'></head>
<body><div class='container col-md-6'><h2>Login</h2><div id='flash'></div>
<form id='form' class='card card-body'>
<input class='form-control mb-2' type='email' name='email' placeholder='Email' required>
<input class='form-control mb-2' type='password' name='password' placeholder='Password' required>
<button class='btn btn-primary'>Login</button></form></div>
<script src='/js/app.js'></script><script>
document.getElementById('form').addEventListener('submit', async (e)=>{e.preventDefault();const f=new FormData(e.target);
try{const data=await api('/auth/login',{method:'POST',body:JSON.stringify(Object.fromEntries(f.entries()))});
localStorage.setItem('token',data.token);localStorage.setItem('user',JSON.stringify(data.user));window.location.href='/dashboard';}
catch(err){setFlash(err.message,'danger');}});
</script></body></html>
