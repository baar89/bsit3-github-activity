<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1'>
<title>Auction Detail</title><link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css' rel='stylesheet'><link rel='stylesheet' href='/css/styles.css'></head>
<body><div class='container'><h2>Auction Details</h2><div id='flash'></div><div id='auction'></div>
<form id='bidForm' class='card card-body mt-3'><h5>Place Bid</h5><input type='number' step='1' class='form-control mb-2' name='amount' placeholder='Bid amount' required><button class='btn btn-success'>Submit Bid</button></form>
<h4 class='mt-4'>Bid History</h4><table class='table'><thead><tr><th>Bidder</th><th>Amount</th><th>Time</th></tr></thead><tbody id='bids'></tbody></table></div>
<script src='/js/app.js'></script><script>
const id=new URLSearchParams(location.search).get('id');
async function load(){try{const data=await api(`/auctions/${id}`);const a=data.auction;auction.innerHTML=`<div class='card card-body'><h4>${a.title}</h4><img src='${a.image}' style='max-width:420px'><p>${a.description}</p><p>Item: ${a.robloxItemName}</p><p>Seller: ${a.sellerId?.username||''}</p><p>Current Bid: $${a.currentBid}</p><p class='countdown' data-end='${a.endTime}'>${countdownLabel(a.endTime)}</p><p>Status: ${a.status}</p></div>`;
bids.innerHTML=data.bids.map(b=>`<tr><td>${b.bidderId?.username||'unknown'}</td><td>$${b.amount}</td><td>${new Date(b.timestamp).toLocaleString()}</td></tr>`).join('');}
catch(e){setFlash(e.message,'danger')}}
setInterval(()=>{document.querySelectorAll('.countdown').forEach(el=>el.textContent=countdownLabel(el.dataset.end));load();},5000);load();
bidForm.addEventListener('submit', async (e)=>{e.preventDefault();try{await fetchCsrf();const amount=Number(new FormData(e.target).get('amount'));await api(`/auctions/${id}/bids`,{method:'POST',body:JSON.stringify({amount})});setFlash('Bid placed','success');load();}catch(err){setFlash(err.message,'danger')}});
</script></body></html>
