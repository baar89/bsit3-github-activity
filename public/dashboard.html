<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1'>
<title>Dashboard</title><link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css' rel='stylesheet'><link rel='stylesheet' href='/css/styles.css'></head>
<body><div class='container'><div class='d-flex justify-content-between'><h2>Dashboard</h2><button class='btn btn-outline-danger' onclick='logout()'>Logout</button></div><div id='flash'></div>
<div id='profile' class='card card-body mb-3'></div>
<a class='btn btn-primary' href='/auctions'>Browse Auctions</a>
<a class='btn btn-outline-secondary' href='/profile'>Edit Profile</a>
<a class='btn btn-outline-dark' href='/admin'>Admin Panel</a></div>
<script src='/js/app.js'></script><script>
(async()=>{try{await fetchCsrf();const me=await api('/users/me');document.getElementById('profile').innerHTML=`
<b>${me.username}</b><br>Email: ${me.email}<br>Approved: ${me.approved}<br>Email verified: ${me.emailVerified}<br>Wins: ${me.auctionWins}<br>Active bids: ${me.activeBids}`;}
catch(e){setFlash(e.message,'danger');}})();
</script></body></html>
