<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1'>
<title>Admin Panel</title><link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css' rel='stylesheet'><link rel='stylesheet' href='/css/styles.css'></head>
<body><div class='container'><h2>Admin Dashboard</h2><div id='flash'></div>
<div id='stats' class='row g-2 mb-3'></div>
<a href='/pending-approvals' class='btn btn-primary'>Manage Pending Users</a>
<a href='/create-auction' class='btn btn-success'>Create Auction</a>
<h4 class='mt-3'>All Bids</h4><table class='table'><thead><tr><th>Auction</th><th>Bidder</th><th>Amount</th></tr></thead><tbody id='bidRows'></tbody></table></div>
<script src='/js/app.js'></script><script>
(async()=>{try{await fetchCsrf();const stats=await api('/admin/stats');const bids=await api('/admin/bids');
statsDiv=Object.entries(stats).map(([k,v])=>`<div class='col-md-3'><div class='card card-body'><small>${k}</small><b>${v}</b></div></div>`).join('');document.getElementById('stats').innerHTML=statsDiv;
bidRows.innerHTML=bids.map(b=>`<tr><td>${b.auctionId?.title||'-'}</td><td>${b.bidderId?.username||'-'}</td><td>$${b.amount}</td></tr>`).join('');}
catch(e){setFlash(e.message,'danger')}})();
</script></body></html>
