<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roblox Auction Platform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<nav class="navbar navbar-expand-lg fixed-top bg-body-tertiary border-bottom">
  <div class="container"><a class="navbar-brand" href="/">Roblox Auctions</a>
    <div class="d-flex gap-2">
      <button class="btn btn-outline-secondary btn-sm" onclick="toggleTheme()">🌓</button>
      <a class="btn btn-outline-primary btn-sm" href="/login">Login</a>
      <a class="btn btn-primary btn-sm" href="/register">Register</a>
    </div>
  </div>
</nav>
<div class="container">
  <div id="flash"></div>
  <h1 class="mb-3">Featured Roblox Item Auctions</h1>
  <div class="row g-3 mb-4" id="featured"></div>
  <h3>Ending Soon</h3>
  <div class="row g-3 mb-4" id="endingSoon"></div>
  <h3>Highest Value</h3>
  <div class="row g-3" id="highest"></div>
</div>
<script src="/js/app.js"></script>
<script>
const renderCard = (a) => `
<div class="col-md-4">
  <div class="card auction-card">
    <img src="${a.image}" class="card-img-top" alt="item" />
    <div class="card-body">
      <h5>${a.title}</h5>
      <p>${a.robloxItemName}</p>
      <p>Current: $${a.currentBid || a.startPrice}</p>
      <p class="countdown" data-end="${a.endTime}">${countdownLabel(a.endTime)}</p>
      <a class="btn btn-sm btn-primary" href="/auction-detail?id=${a._id}">View Auction</a>
    </div>
  </div>
</div>`;

(async () => {
  try {
    const data = await api('/auctions/landing');
    document.getElementById('featured').innerHTML = data.featured.map(renderCard).join('');
    document.getElementById('endingSoon').innerHTML = data.endingSoon.map(renderCard).join('');
    document.getElementById('highest').innerHTML = data.highestValue.map(renderCard).join('');
    setInterval(() => {
      document.querySelectorAll('.countdown').forEach(el => el.textContent = countdownLabel(el.dataset.end));
    }, 1000);
  } catch (e) { setFlash(e.message, 'danger'); }
})();
</script>
</body>
</html>
